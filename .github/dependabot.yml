version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    groups:
      github-actions-safe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm packages. One entry for the whole pnpm workspace: dependabot's npm
  # fetcher pulls in pnpm-workspace.yaml and every member package.json from
  # here, so a second entry per package raises the same bump twice.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 1
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        dependency-type: "production"
        update-types:
          - "patch"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    groups:
      docker-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
