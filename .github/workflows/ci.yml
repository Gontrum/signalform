name: CI

on:
  push:
    branches: ["**"] # All branches
  pull_request:
    branches: [main] # PRs to main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IS_DEPENDABOT_UPDATE: ${{ github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.ref_name, 'dependabot/') }}

jobs:
  quality-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: |
          if [ "${IS_DEPENDABOT_UPDATE}" = "true" ]; then
            echo "Installing dependencies for Dependabot PR (allowing lockfile updates)..."
            pnpm install --no-frozen-lockfile
          else
            echo "Installing dependencies with frozen lockfile..."
            pnpm install --frozen-lockfile
          fi

      - name: Build shared package
        run: pnpm --filter @signalform/shared build

      - name: Run ESLint
        run: pnpm -r lint

      - name: Run TypeScript type-check
        run: pnpm -r type-check

      - name: Run Prettier check
        run: pnpm -r format:check

      - name: Run tests with coverage
        run: pnpm -r test:coverage

      - name: Build production
        run: pnpm -r build

      - name: Run shellcheck
        # Die .claude/.husky-Hooks tragen das Agent-Routing und die Commit-Gates.
        # Ein Syntaxfehler dort fällt sonst erst auf, wenn ein Gate lautlos ausfällt.
        run: shellcheck install.sh scripts/build-release.sh .claude/hooks/*.sh .husky/pre-commit .husky/pre-push .husky/commit-msg

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: |
          if [ "${IS_DEPENDABOT_UPDATE}" = "true" ]; then
            echo "Installing dependencies for Dependabot PR (allowing lockfile updates)..."
            pnpm install --no-frozen-lockfile
          else
            echo "Installing dependencies with frozen lockfile..."
            pnpm install --frozen-lockfile
          fi

      - name: Build shared package
        run: pnpm --filter @signalform/shared build

      - name: Check for dead code (knip)
        run: pnpm run check:dead

      - name: Check architecture (dependency-cruiser)
        run: pnpm run check:arch

      - name: Check type coverage
        run: pnpm run check:any

      - name: Check duplication (jscpd)
        run: pnpm run check:dupes

  e2e:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: |
          if [ "${IS_DEPENDABOT_UPDATE}" = "true" ]; then
            echo "Installing dependencies for Dependabot PR (allowing lockfile updates)..."
            pnpm install --no-frozen-lockfile
          else
            echo "Installing dependencies with frozen lockfile..."
            pnpm install --frozen-lockfile
          fi

      - name: Build shared package
        run: pnpm --filter @signalform/shared build

      - name: Build frontend
        run: pnpm --filter frontend build-only

      - name: Install Playwright browsers (Chromium only)
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run E2E tests (mocked, no LMS required)
        run: pnpm --filter frontend test:e2e:ci

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 7
